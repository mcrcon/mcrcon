name: Release

# Cut a release by pushing a tag:
#   git tag v1.0.0 && git push origin v1.0.0
# GoReleaser builds all platforms, publishes GitHub Releases assets,
# and stamps the version via -ldflags "-X main.version=...".

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for the changelog

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          # NOTE: if the org enforces read-only GITHUB_TOKEN for workflows,
          # create a PAT (classic `repo` scope, or fine-grained with
          # Contents: read+write on this repo) and store it as the
          # RELEASE_TOKEN repo secret. Falls back to GITHUB_TOKEN where
          # workflow write access is allowed.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN != '' && secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
